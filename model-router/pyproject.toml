[project]
name = "model-router"
version = "0.1.0"
description = "Take-home model router: seeded simulator, policies, replay."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
model-router = "model_router.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
